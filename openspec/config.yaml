schema: spec-driven

context: |
  Personal reading-list CLI for one person on one machine.
  Keep it a local command-line tool: no server, accounts, or sync.
  Prefer the stack and patterns already in the repo.

rules:
  proposal:
    - State what is out of scope
    - Keep the change to one reading-list behavior
  specs:
    - Every requirement uses RFC 2119 keywords (MUST, SHOULD, MAY)
    - Scenarios use GIVEN / WHEN / THEN
    - Cover edge cases such as a missing list file and empty fields
  design:
    - Prefer the existing JSON file and node:util parseArgs
    - Do not add a database, a web UI, or a third-party CLI framework unless the change requires it
  tasks:
    - Keep each task small enough to implement and test in one pass
    - Include a test task for each behavior change

operations:
  apply:
    guidance:
      - Use kebab-case file names, PascalCase for types, and camelCase for functions
      - Keep types explicit and do not use any
      - Prefer small, readable modules over extra abstraction
      - CLI errors should be clear to the person running the command
